<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Every Cornell club event, in one place. Follow the clubs you care about and see what's on.">
<meta name="theme-color" content="#b31b1b">

<meta property="og:type" content="website">
<meta property="og:title" content="Big Red Radar">
<meta property="og:description" content="Every Cornell club event, in one place.">
<meta property="og:url" content="https://bigredradar.onrender.com/">
<meta property="og:image" content="https://bigredradar.onrender.com/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@500&display=swap">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root {
    --red:     #a81c1c;
    --bg:      #f7f5f1;
    --surface: #efebe4;
    --raised:  #fffefc;
    --ink:     #191817;
    --muted:   #78726a;
    --faint:   #a8a199;
    --tick:    #ded7cb;

    --display: 'Space Grotesk', system-ui, sans-serif;
    --text:    'Inter', system-ui, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --red:     #e8574a;
      --bg:      #121110;
      --surface: #1c1b19;
      --raised:  #232220;
      --ink:     #f2efea;
      --muted:   #948d84;
      --faint:   #635d56;
      --tick:    #302d29;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.55 var(--text);
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; cursor: pointer; }
  a { color: inherit; }

  .app { display: flex; min-height: 100vh; }

  .sidebar {
    display: flex;
    flex-direction: column;
    width: 238px;
    flex-shrink: 0;
    padding: 34px 22px 34px 30px;
    background: var(--surface);
  }

  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
  .brand .logo { flex-shrink: 0; color: var(--red); }

  .burger {
    flex-shrink: 0;
    margin-left: auto;
    padding: 6px;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--faint);
    line-height: 0;
  }
  .burger:hover { color: var(--ink); background: var(--raised); }

  .wordmark {
    font: 500 10px/1 var(--mono);
    letter-spacing: 0.33em;
    text-transform: uppercase;
    color: var(--red);
  }
  .wordmark em {
    display: block;
    margin-top: 5px;
    font: 700 23px/1 var(--display);
    font-style: normal;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .tagline {
    margin: 15px 0 32px;
    padding-right: 20px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--faint);
  }

  .navbtn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 2px;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--muted);
    font: 500 14px/1.5 var(--text);
    text-align: left;
  }
  .navbtn:hover { background: var(--raised); color: var(--ink); }
  .navbtn.on { background: var(--red); color: #fff; font-weight: 600; }
  .navbtn .ic { flex-shrink: 0; }
  .navbtn .lbl { flex: 1; }
  .navbtn .count { font: 500 11px/1.7 var(--mono); opacity: 0.6; }


  .account {
    position: fixed;
    top: 14px;
    right: 20px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px 4px 4px;
    background: var(--surface);
    border-radius: 999px;
  }
  .who img { width: 24px; height: 24px; border-radius: 50%; }
  .who .nm {
    max-width: 140px;
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .signout {
    padding: 0;
    border: 0;
    background: none;
    color: var(--faint);
    font: 500 10px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .signout:hover { color: var(--red); }

  @media (max-width: 620px) {
    .account { top: 12px; right: 14px; }
    .who .nm { display: none; }
    .who { padding: 4px; }
  }

  @media (min-width: 801px) {
    .app.collapsed .sidebar { width: 66px; padding-left: 13px; padding-right: 13px; }
    .app.collapsed .brand { justify-content: center; }
    .app.collapsed .wordmark,
    .app.collapsed .tagline,
    .app.collapsed .logo,
    .app.collapsed .lbl,
    .app.collapsed .count { display: none; }
    .app.collapsed .navbtn { justify-content: center; padding: 10px 0; }
    .app.collapsed .burger { margin: 0 auto; }
    .app.collapsed .brand { margin-bottom: 22px; }
  }
  @media (max-width: 800px) { .burger { display: none; } }

  .main { flex: 1; min-width: 0; padding: 0 26px 100px; }
  .inner { max-width: 690px; margin: 0 auto; }

  .topbar { display: none; align-items: center; gap: 13px; padding: 14px 0 4px; }
  .hamburger {
    padding: 4px 9px;
    border: 0;
    border-radius: 4px;
    background: var(--surface);
    color: var(--ink);
    line-height: 1.2;
  }
  .topbar .wordmark { font-size: 15px; }
  .topbar .wordmark em {
    display: inline;
    margin: 0 0 0 6px;
    font-size: 10px;
    letter-spacing: 0.2em;
  }

  .backdrop { display: none; }

  @media (max-width: 800px) {
    .topbar { display: flex; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.16s ease;
    }
    .sidebar.open { transform: none; }
    .backdrop.show {
      display: block;
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0,0,0,0.45);
    }
  }

  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 36px 0 18px;
  }
  .head h2 {
    margin: 0;
    font: 700 32px/1.05 var(--display);
    letter-spacing: -0.035em;
  }
  .head .sub { margin: 7px 0 0; font-size: 13px; color: var(--muted); }

  .ghost {
    flex-shrink: 0;
    padding: 7px 13px;
    border: 0;
    border-radius: 4px;
    background: var(--surface);
    color: var(--muted);
    font: 500 11px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .ghost:hover { color: var(--red); }

  .field {
    width: 100%;
    padding: 11px 14px;
    font: 400 14.5px/1.5 var(--text);
    color: var(--ink);
    background: var(--surface);
    border: 0;
    border-radius: 4px;
  }
  .field::placeholder { color: var(--faint); }
  .field:focus { outline: 2px solid var(--red); outline-offset: -2px; }

  .primary {
    padding: 12px 22px;
    border: 0;
    border-radius: 4px;
    background: var(--red);
    color: #fff;
    font: 600 14px/1.2 var(--text);
  }
  .primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }

  .pills {
    display: flex;
    gap: 20px;
    margin-top: 18px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .pills::-webkit-scrollbar { display: none; }

  .pill {
    flex: 0 0 auto;
    padding: 5px 0 7px;
    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    background: none;
    color: var(--faint);
    font: 500 10.5px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }
  .pill:hover { color: var(--muted); }
  .pill.on { color: var(--ink); border-bottom-color: var(--red); }
  .pill .n { margin-left: 5px; opacity: 0.45; }
  .chip {
    padding: 7px 12px;
    border: 0;
    border-radius: 4px;
    background: var(--surface);
    color: var(--muted);
    font: 450 13px/1.35 var(--text);
  }
  .chip:hover { background: var(--raised); color: var(--ink); }
  .chip.on { background: var(--red); color: #fff; font-weight: 600; }
  .chip .n { margin-left: 6px; font: 500 10px/1 var(--mono); opacity: 0.5; }

  .bar {
    position: sticky; bottom: 0;
    padding: 18px 0;
    background: linear-gradient(transparent, var(--bg) 38%);
  }

  .daystrip {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 0;
    margin: 26px 0 0;
    padding: 0 0 14px;
    background: var(--bg);
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .daystrip::-webkit-scrollbar { display: none; }

  .day {
    flex: 0 0 auto;
    width: 48px;
    padding: 9px 0 0;
    border: 0;
    border-top: 2px solid var(--tick);
    border-radius: 0;
    background: none;
    text-align: center;
    color: var(--faint);
  }
  .day.wide { width: auto; padding-inline: 14px; }
  .day:hover { border-top-color: var(--muted); color: var(--muted); }

  .day .dw {
    display: block;
    font: 500 9px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .day .dd {
    display: block;
    margin-top: 4px;
    font: 600 18px/1.1 var(--display);
    letter-spacing: -0.03em;
    color: var(--muted);
  }
  .day .dot {
    width: 3px; height: 3px;
    margin: 5px auto 0;
    border-radius: 50%;
    background: var(--faint);
  }
  .day .dot.off { background: transparent; }

  .day.on { border-top-color: var(--red); color: var(--red); }
  .day.on .dd { color: var(--red); }
  .day.on .dot { background: var(--red); }
  .day.on .dot.off { background: transparent; }
  .day.empty .dd { opacity: 0.4; }

  .dayhead { display: flex; align-items: baseline; gap: 12px; padding: 18px 0 6px; }
  .dayhead .n {
    font: 700 44px/0.85 var(--display);
    letter-spacing: -0.05em;
  }
  .dayhead .w {
    font: 500 10.5px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--faint);
  }
  .dayhead .w b { display: block; font-weight: 500; color: var(--muted); }

  .minidate {
    padding: 22px 0 6px;
    font: 500 10.5px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--faint);
  }

  .event {
    display: grid;
    grid-template-columns: 82px 1fr auto;
    gap: 14px;
    align-items: start;
    padding: 11px 14px;
    margin: 0 -14px;
    border-radius: 5px;
  }
  .event:hover {
    background: var(--raised);
    box-shadow: inset 2px 0 0 var(--red);
  }

  .time {
    padding-top: 1px;
    text-align: right;
    font: 500 12px/1.6 var(--mono);
    color: var(--red);
    white-space: nowrap;
  }
  .time.allday { color: var(--faint); letter-spacing: 0.04em; }

  .title {
    display: block;
    font: 500 15.5px/1.35 var(--text);
    letter-spacing: -0.005em;
    text-decoration: none;
  }
  .title:hover { text-decoration: underline; text-underline-offset: 2px; }

  .meta { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .meta .where { color: var(--faint); }

  .cal {
    padding-top: 3px;
    font: 500 10px/1.6 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--faint);
    text-decoration: none;
    white-space: nowrap;
  }
  .cal:hover { color: var(--red); }

  @media (hover: hover) {
    .cal { opacity: 0; transition: opacity 0.12s; }
    .event:hover .cal, .cal:focus { opacity: 1; }
  }

  @media (max-width: 560px) {
    .main { padding: 0 16px 90px; }
    .head { padding-top: 26px; }
    .head h2 { font-size: 26px; }
    .event { grid-template-columns: 64px 1fr; gap: 11px; padding: 10px 12px; margin: 0 -12px; }
    .cal { grid-column: 2; padding-top: 5px; }
    .dayhead .n { font-size: 36px; }
  }

  .status { padding: 54px 0; text-align: center; color: var(--muted); font-size: 14px; }
  .status .primary, .status .ghost { margin-top: 18px; }
  .status code {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 8px;
    background: var(--surface);
    border-radius: 4px;
    font: 500 12px/1.6 var(--mono);
  }
</style>
</head>
<body>

<script type="module">

const screenEl = document.getElementById('screen')
const sidebar  = document.getElementById('sidebar')
const backdrop = document.getElementById('backdrop')

let orgs = []
let follows = loadFollows()
let me = null
let clientId = ''

function loadFollows() {
  try { return new Set(JSON.parse(localStorage.getItem('brr.follows') || '[]')) }
  catch { return new Set() }
}

function saveFollows() {
  try { localStorage.setItem('brr.follows', JSON.stringify([...follows])) }
  catch {}
  pushFollows()
}

async function pushFollows() {
  if (!me) return

  try {
    await fetch('/subscriptions', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slugs: [...follows] }),
    })
  } catch (err) {
    console.error(err)
  }
}

function paintAccount() {
  const box = document.getElementById('account')

  if (me) {
    box.innerHTML = `
      <div class="who">
        ${me.picture_url ? `<img src="${esc(me.picture_url)}" alt="">` : ''}
        <span class="nm">${esc(me.name || me.email)}</span>
      </div>
      <button class="signout" id="signout">Sign out</button>`

    document.getElementById('signout').addEventListener('click', doSignOut)
    return
  }

  box.innerHTML = '<div id="gbtn"></div>'
  renderGoogleButton()
}

function renderGoogleButton(tries = 0) {
  const el = document.getElementById('gbtn')
  if (!el || !clientId) return

  if (!window.google || !window.google.accounts || !window.google.accounts.id) {
    if (tries < 40) setTimeout(() => renderGoogleButton(tries + 1), 150)
    return
  }

  window.google.accounts.id.initialize({ client_id: clientId, callback: onGoogleCredential })
  window.google.accounts.id.renderButton(el, {
    theme: 'outline',
    size: 'medium',
    text: 'signin_with',
    width: 190,
  })
}

async function onGoogleCredential(response) {
  try {
    const res = await fetch('/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
    })

    if (!res.ok) throw new Error('sign in failed')

    const data = await res.json()
    me = data.user

    for (const slug of data.follows) follows.add(slug)

    saveFollows()
    updateFollowCount()
    paintAccount()
    go('feed')
  } catch (err) {
    console.error(err)
  }
}

async function doSignOut() {
  try { await fetch('/auth/logout', { method: 'POST' }) }
  catch (err) { console.error(err) }

  me = null
  paintAccount()
}

const ITHACA = 'America/New_York'
const fmtTime  = new Intl.DateTimeFormat('en-US', { timeZone: ITHACA, hour: 'numeric', minute: '2-digit' })
const fmtKey   = new Intl.DateTimeFormat('en-CA', { timeZone: ITHACA, year: 'numeric', month: '2-digit', day: '2-digit' })
const fmtWkShort = new Intl.DateTimeFormat('en-US', { timeZone: ITHACA, weekday: 'short' })
const fmtWkLong  = new Intl.DateTimeFormat('en-US', { timeZone: ITHACA, weekday: 'long' })
const fmtMonth   = new Intl.DateTimeFormat('en-US', { timeZone: ITHACA, month: 'long' })

const STRIP_DAYS = 21

const CATEGORIES = [
  ['project-team',     'Project Teams'],
  ['academic',         'Academic & Research'],
  ['pre-professional', 'Pre-Professional'],
  ['cultural',         'Cultural & Identity'],
  ['performing-arts',  'Arts & Performance'],
  ['sports',           'Sports & Fitness'],
  ['gaming',           'Gaming'],
  ['service',          'Service & Advocacy'],
  ['religious',        'Religious & Spiritual'],
  ['political',        'Politics'],
  ['interest',         'Hobbies & Interests'],
  ['media',            'Media'],
  ['greek',            'Greek & Honor Societies'],
  ['campus',           'Campus & Venues'],
  ['residential',      'Residential'],
  ['graduate',         'Graduate & Professional'],
]

function dayKeys(count) {
  const [y, m, d] = fmtKey.format(new Date()).split('-').map(Number)
  const noon = Date.UTC(y, m - 1, d, 16) 
  const keys = []

  for (let i = 0; i < count; i++) {
    keys.push(fmtKey.format(new Date(noon + i * 86400000)))
  }

  return keys
}

function keyToDate(key) {
  const [y, m, d] = key.split('-').map(Number)
  return new Date(Date.UTC(y, m - 1, d, 16))
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
}

async function getJson(url) {
  const res = await fetch(url)
  if (!res.ok) throw new Error(`${url} returned ${res.status}`)
  return res.json()
}

function matches(e, q) {
  return (e.title || '').toLowerCase().includes(q)
      || (e.org_name || '').toLowerCase().includes(q)
      || (e.location || '').toLowerCase().includes(q)
}

function utcStamp(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '') }
function ymd(d) { return fmtKey.format(d).replace(/-/g, '') }

function gcalUrl(e) {
  const start = new Date(e.starts_at)
  const hour = 60 * 60 * 1000

  let dates
  if (e.all_day) {
    const end = e.ends_at ? new Date(e.ends_at) : new Date(start.getTime() + 24 * hour)
    dates = `${ymd(start)}/${ymd(end)}`
  } else {
    const end = e.ends_at ? new Date(e.ends_at) : new Date(start.getTime() + hour)
    dates = `${utcStamp(start)}/${utcStamp(end)}`
  }

  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: e.org_name ? `${e.title} (${e.org_name})` : e.title,
    dates,
    details: [e.description || '', e.url ? `\n\n${e.url}` : ''].join('').trim(),
    location: e.location || '',
    ctz: ITHACA,
  })

  return 'https://calendar.google.com/calendar/render?' + params.toString()
}

function rowHtml(e) {
  const when = new Date(e.starts_at)

  const time = e.time_tba
    ? '<div class="time allday">Time TBA</div>'
    : e.all_day
      ? '<div class="time allday">All Day</div>'
      : `<div class="time">${fmtTime.format(when)}</div>`

  const where = e.location ? ` <span class="where">&middot; ${esc(e.location)}</span>` : ''

  return `
    <div class="event">
      ${time}
      <div>
        <a class="title" href="${esc(e.url || '#')}" target="_blank" rel="noopener">${esc(e.title)}</a>
        <div class="meta">${esc(e.org_name)}${where}</div>
      </div>
      <a class="cal" href="${esc(gcalUrl(e))}" target="_blank" rel="noopener">+ Cal</a>
    </div>`
}

function rowsHtml(events) {
  return events.map(rowHtml).join('')
}

function groupedHtml(events) {
  let html = ''
  let day = null

  for (const e of events) {
    const when = new Date(e.starts_at)
    const key = fmtKey.format(when)

    if (key !== day) {
      day = key
      html += `<div class="minidate">${fmtWkLong.format(when)} &middot; ${fmtMonth.format(when)} ${when.getUTCDate()}</div>`
    }

    html += rowHtml(e)
  }

  return html
}

function mountBrowser(root, events) {
  const byDay = new Map()

  for (const e of events) {
    const k = fmtKey.format(new Date(e.starts_at))
    if (!byDay.has(k)) byDay.set(k, [])
    byDay.get(k).push(e)
  }

  const keys = dayKeys(STRIP_DAYS)
  const horizon = keys[keys.length - 1]
  const later = events.filter(e => fmtKey.format(new Date(e.starts_at)) > horizon)

  let selected = keys.find(k => byDay.has(k)) ?? (later.length ? 'later' : keys[0])

  root.innerHTML = `
    <div class="daystrip" id="strip"></div>
    <div id="dayview"></div>
  `

  const strip = root.querySelector('#strip')
  const view  = root.querySelector('#dayview')

  function paintStrip() {
    let html = keys.map((k, i) => {
      const d = keyToDate(k)
      const n = byDay.get(k)?.length ?? 0

      return `
        <button class="day ${k === selected ? 'on' : ''} ${n ? '' : 'empty'}" data-key="${k}">
          <span class="dw">${i === 0 ? 'Today' : fmtWkShort.format(d)}</span>
          <span class="dd">${d.getUTCDate()}</span>
          <span class="dot ${n ? '' : 'off'}"></span>
        </button>`
    }).join('')

    if (later.length) {
      html += `
        <button class="day wide ${selected === 'later' ? 'on' : ''}" data-key="later">
          <span class="dw">After</span>
          <span class="dd">Later</span>
          <span class="dot"></span>
        </button>`
    }

    strip.innerHTML = html
  }

  function paintDay() {
    if (selected === 'later') {
      view.innerHTML = `
        <div class="dayhead"><span class="n">&hellip;</span><span class="w"><b>Later</b>beyond ${STRIP_DAYS} days</span></div>
        ${groupedHtml(later)}`
      return
    }

    const d = keyToDate(selected)
    const list = byDay.get(selected) ?? []

    view.innerHTML = `
      <div class="dayhead">
        <span class="n">${d.getUTCDate()}</span>
        <span class="w"><b>${fmtWkLong.format(d)}</b>${fmtMonth.format(d)}</span>
      </div>
      ${list.length ? rowsHtml(list) : '<p class="status">Nothing on this day.</p>'}`
  }

  strip.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.day')
    if (!btn) return

    selected = btn.dataset.key
    paintStrip()
    paintDay()
    btn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' })
  })

  paintStrip()
  paintDay()
}

function showClubs() {
  const first = followedCount() === 0

  if (orgs.length === 0) {
    screenEl.innerHTML = `<div class="status">No clubs in the database yet.<br><code>npx tsx src/ingest.ts</code></div>`
    return
  }

  screenEl.innerHTML = `
    <div class="head">
      <div>
        <h2>${first ? 'Pick Your Clubs' : 'My Clubs'}</h2>
        <p class="sub">${first
          ? 'Your feed shows only these. Change it whenever.'
          : 'Tap to follow or unfollow.'}</p>
      </div>
    </div>
    <input class="field" id="clubSearch" type="search" placeholder="Search ${orgs.length} clubs">
    <div class="pills" id="cats"></div>
    <div class="chips" id="chips"></div>
    <div class="bar"><button class="primary" id="done"></button></div>
  `

  const search = document.getElementById('clubSearch')
  const cats   = document.getElementById('cats')
  const chips  = document.getElementById('chips')
  const done   = document.getElementById('done')

  let picks = new Set()

  function chipHtml(o) {
    return `<button class="chip ${follows.has(o.slug) ? 'on' : ''}" data-slug="${esc(o.slug)}">
      ${esc(o.name)}<span class="n">${o.upcoming}</span></button>`
  }

  function byActivity(a, b) {
    return (b.upcoming - a.upcoming) || a.name.localeCompare(b.name)
  }

  function paintCats() {
    let html = `<button class="pill ${picks.size ? '' : 'on'}" data-cat="all">All<span class="n">${orgs.length}</span></button>`

    const nFollowed = followedCount()

    if (nFollowed) {
      html += `<button class="pill ${picks.has('following') ? 'on' : ''}" data-cat="following">Following<span class="n">${nFollowed}</span></button>`
    }

    for (const [key, label] of CATEGORIES) {
      const n = orgs.filter(o => o.category === key).length
      if (!n) continue
      html += `<button class="pill ${picks.has(key) ? 'on' : ''}" data-cat="${key}">${label}<span class="n">${n}</span></button>`
    }

    cats.innerHTML = html
  }

  function inPicks(o) {
    if (!picks.size) return true
    if (picks.has('following') && follows.has(o.slug)) return true
    return picks.has(o.category)
  }

  function paintChips() {
    const q = search.value.trim().toLowerCase()

    const list = q
      ? orgs.filter(o => o.name.toLowerCase().includes(q))
      : orgs.filter(inPicks)

    list.sort((a, b) => {
      const fa = follows.has(a.slug) ? 1 : 0
      const fb = follows.has(b.slug) ? 1 : 0
      return (fb - fa) || byActivity(a, b)
    })

    chips.innerHTML = list.length
      ? list.map(chipHtml).join('')
      : '<p class="sub">Nothing here.</p>'

    const n = followedCount()

    done.textContent = n ? `See My Feed (${n})` : 'Pick At Least One'
    done.disabled = n === 0
  }

  cats.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.pill')
    if (!btn) return

    const key = btn.dataset.cat
    if (key === 'all') picks.clear()
    else if (picks.has(key)) picks.delete(key)
    else picks.add(key)

    search.value = ''
    paintCats()
    paintChips()
  })

  chips.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.chip')
    if (!btn) return

    const slug = btn.dataset.slug
    if (follows.has(slug)) follows.delete(slug)
    else follows.add(slug)

    saveFollows()
    updateFollowCount()
    paintCats()
    paintChips()
  })

  search.addEventListener('input', paintChips)
  done.addEventListener('click', () => go('feed'))

  paintCats()
  paintChips()
}

async function showEvents({ title, sub, url, categories = false }) {
  screenEl.innerHTML = '<p class="status">Loading&hellip;</p>'

  const { events } = await getJson(url)

  screenEl.innerHTML = `
    <div class="head">
      <div>
        <h2>${esc(title)}</h2>
        <p class="sub">${esc(typeof sub === 'function' ? sub(events) : sub)}</p>
      </div>
      <button class="ghost" id="edit">Edit Clubs</button>
    </div>
    <input class="field" id="q" type="search" placeholder="Search for any events or clubs">
    ${categories ? '<div class="pills" id="cats"></div>' : ''}
    <div id="body"></div>
  `

  document.getElementById('edit').addEventListener('click', showClubs)

  const body = document.getElementById('body')
  const cats = document.getElementById('cats')
  const picks = new Set()

  function selected() {
    return picks.size ? events.filter(e => picks.has(e.org_category)) : events
  }

  function paintCats() {
    if (!cats) return

    let html = `<button class="pill ${picks.size ? '' : 'on'}" data-cat="all">All</button>`

    for (const [key, label] of CATEGORIES) {
      const n = events.filter(e => e.org_category === key).length
      if (!n) continue
      html += `<button class="pill ${picks.has(key) ? 'on' : ''}" data-cat="${key}">${label}</button>`
    }

    cats.innerHTML = html
  }

  function paint() {
    const q = document.getElementById('q').value.trim().toLowerCase()
    const pool = selected()

    if (q) {
      const hits = pool.filter(e => matches(e, q))
      body.innerHTML = hits.length ? groupedHtml(hits) : '<p class="status">Nothing found.</p>'
      return
    }

    if (!pool.length) {
      body.innerHTML = `<div class="status">Nothing coming up.<br>
        <button class="primary" id="toExplore">Explore Everything</button></div>`
      const b = document.getElementById('toExplore')
      if (b) b.addEventListener('click', () => go('explore'))
      return
    }

    mountBrowser(body, pool)
  }

  if (cats) {
    cats.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.pill')
      if (!btn) return
      const key = btn.dataset.cat
      if (key === 'all') picks.clear()
      else if (picks.has(key)) picks.delete(key)
      else picks.add(key)
      paintCats()
      paint()
    })
  }

  document.getElementById('q').addEventListener('input', paint)

  paintCats()
  paint()
}

function showFeed() {
  if (followedCount() === 0) return showClubs()

  return showEvents({
    title: 'My Feed',
    sub: (ev) => `${ev.length} upcoming | ${followedCount()} club${followedCount() === 1 ? '' : 's selected'}`,
    url: '/events?orgs=' + encodeURIComponent([...follows].join(',')),
  })
}

function showExplore() {
  return showEvents({
    title: 'Explore',
    sub: 'Everything happening at Cornell',
    url: '/events',
    categories: true,
  })
}

function followedCount() {
  return orgs.filter(o => follows.has(o.slug)).length
}

function updateFollowCount() {
  document.getElementById('followCount').textContent = followedCount() || ''
}

function go(next) {
  for (const b of document.querySelectorAll('.navbtn[data-view]')) {
    b.classList.toggle('on', b.dataset.view === next)
  }

  closeSidebar()

  if (next === 'explore') showExplore()
  else showFeed()
}

function closeSidebar() {
  sidebar.classList.remove('open')
  backdrop.classList.remove('show')
}

document.getElementById('hamburger').addEventListener('click', () => {
  sidebar.classList.add('open')
  backdrop.classList.add('show')
})

backdrop.addEventListener('click', closeSidebar)

for (const b of document.querySelectorAll('.navbtn[data-view]')) {
  b.addEventListener('click', () => go(b.dataset.view))
}

const appEl = document.querySelector('.app')

function setCollapsed(on) {
  appEl.classList.toggle('collapsed', on)
  try { localStorage.setItem('brr.collapsed', on ? '1' : '') } catch {}
}

try { if (localStorage.getItem('brr.collapsed')) appEl.classList.add('collapsed') } catch {}

document.getElementById('collapse').addEventListener('click', () => {
  setCollapsed(!appEl.classList.contains('collapsed'))
})

try {
  const [orgData, session] = await Promise.all([getJson('/orgs'), getJson('/session')])

  orgs = orgData.orgs ?? []
  clientId = session.googleClientId || ''
  me = session.user || null

  if (me) {
    follows = new Set(session.follows || [])
    try { localStorage.setItem('brr.follows', JSON.stringify([...follows])) } catch {}
  }

  updateFollowCount()
  paintAccount()
  go('feed')
} catch (err) {
  screenEl.innerHTML = `<div class="status">Couldn't load: ${esc(err.message)}<br><code>npx tsx src/api.ts</code></div>`
  console.error(err)
}
</script>
</body>
